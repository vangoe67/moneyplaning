<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ephemeral Chat (Zero-Trace)</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .chat-container { width: 100%; max-width: 500px; background: #1e1e1e; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 80vh; border: 1px solid #333; }
    .chat-header { background: #252525; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; color: #00ff88; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg-item { background: #2a2a2a; padding: 10px; border-radius: 8px; max-width: 80%; width: fit-content; word-break: break-word; }
    .msg-item.self { align-self: flex-end; background: #005c4b; }
    .msg-item img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
    .unsend-btn { background: none; border: none; color: #ff5555; font-size: 11px; cursor: pointer; margin-top: 5px; text-decoration: underline; display: block; }
    .chat-input { padding: 10px; background: #252525; border-top: 1px solid #333; display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #121212; color: #fff; outline: none; }
    label.upload-btn { cursor: pointer; background: #333; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
    input[type="file"] { display: none; }
    button.send-btn { background: #00ff88; color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Zero-Trace Private Chat</div>
  <div class="chat-box" id="chat-box"></div>
  <div class="chat-input">
    <label class="upload-btn">📷 <input type="file" id="file-input" accept="image/*"></label>
    <input type="text" id="text-input" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key === 'Enter') sendText()">
    <button class="send-btn" onclick="sendText()">ส่ง</button>
  </div>
</div>

<script>
  // 1. ระบุ URL เซิร์ฟเวอร์ (เปลี่ยนเป็น URL ของ Render เมื่อทำ Backend เสร็จ)
  const SERVER_URL = "http://localhost:3000"; 
  const socket = io(SERVER_URL, { autoConnect: false });

  // เชื่อมต่อทันทีเมื่อเปิดหน้าเว็บ
  socket.connect();

  // ตัวแปรเก็บ References ใน RAM เท่านั้น (ไม่เซฟลง Storage ใดๆ)
  const activeMessages = new Map();

  // รับข้อมูลจากเซิร์ฟเวอร์
  socket.on('receive-payload', (payload) => renderPayload(payload, false));
  socket.on('destroy-payload', (id) => purgeFromMemory(id));

  function sendText() {
    const input = document.getElementById('text-input');
    const text = input.value.trim();
    if (!text) return;

    const payload = {
      id: generateId(),
      type: 'text',
      content: text
    };

    renderPayload(payload, true);
    socket.emit('send-payload', payload);
    input.value = '';
  }

  // ส่งรูปภาพผ่าน RAM (Base64 Data URL)
  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const payload = {
        id: generateId(),
        type: 'image',
        content: evt.target.result
      };

      renderPayload(payload, true);
      socket.emit('send-payload', payload);
    };
    reader.readAsDataURL(file);
    this.value = ''; // ล้างไฟล์ออกจาก Element ทันที
  });

  function renderPayload(payload, isSelf) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg-item ${isSelf ? 'self' : ''}`;
    div.id = `msg-${payload.id}`;

    if (payload.type === 'text') {
      const p = document.createElement('p');
      p.textContent = payload.content;
      div.appendChild(p);
    } else if (payload.type === 'image') {
      const img = document.createElement('img');
      img.src = payload.content;
      div.appendChild(img);
    }

    if (isSelf) {
      const btn = document.createElement('button');
      btn.className = 'unsend-btn';
      btn.textContent = 'ยกเลิกข้อความ';
      btn.onclick = () => socket.emit('unsend-payload', payload.id);
      div.appendChild(btn);
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    activeMessages.set(payload.id, div);
  }

  // ทำลายข้อมูลออกจากหน่วยความจำ (RAM) และ DOM
  function purgeFromMemory(id) {
    const element = activeMessages.get(id);
    if (element) {
      const img = element.querySelector('img');
      if (img) img.src = ''; // ตัดการเชื่อมโยงเพื่อเปิดทางให้ Garbage Collector
      element.remove();
      activeMessages.delete(id);
    }
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  }

  // ล้างหน่วยความจำทั้งหมดเมื่อปิด/รีโหลดหน้าจอ
  window.addEventListener('beforeunload', () => {
    activeMessages.forEach((_, id) => purgeFromMemory(id));
    activeMessages.clear();
  });
</script>

</body>
</html>
