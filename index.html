<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Ephemeral Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; }
    .msg-item { margin-bottom: 10px; }
    .msg-item img { max-width: 200px; display: block; }
  </style>
</head>
<body>
  <div id="chat-box"></div>
  <input type="text" id="text-input" placeholder="พิมพ์ข้อความ...">
  <input type="file" id="file-input" accept="image/*">
  <button onclick="sendText()">ส่งข้อความ</button>

  <script>
    const socket = io();
    // เก็บอ้างอิง DOM Elements ไว้ใน RAM ชั่วคราว
    const activeMessages = new Map();

    // รับข้อมูลจากเซิร์ฟเวอร์
    socket.on('receive-payload', (payload) => {
      renderPayload(payload, false);
    });

    // รับคำสั่งลบข้อมูล
    socket.on('destroy-payload', (id) => {
      purgeFromMemory(id);
    });

    function sendText() {
      const input = document.getElementById('text-input');
      if (!input.value) return;

      const payload = {
        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
        type: 'text',
        content: input.value
      };

      renderPayload(payload, true);
      socket.emit('send-payload', payload);
      input.value = '';
    }

    // จัดการการส่งรูปภาพแบบ Base64 ใน RAM
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const payload = {
          id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
          type: 'image',
          content: evt.target.result // ส่งข้อมูลรูปภาพในรูปแบบ Data URL
        };

        renderPayload(payload, true);
        socket.emit('send-payload', payload);
      };
      reader.readAsDataURL(file);
      this.value = ''; // เคลียร์ File Input ทันทีเพื่อไม่ให้ค้างใน DOM
    });

    function renderPayload(payload, isSelf) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg-item';
      div.id = `msg-${payload.id}`;

      if (payload.type === 'text') {
        div.innerText = payload.content + ' ';
      } else if (payload.type === 'image') {
        const img = document.createElement('img');
        img.src = payload.content;
        div.appendChild(img);
      }

      const unsendBtn = document.createElement('button');
      unsendBtn.innerText = 'ยกเลิกข้อความ';
      unsendBtn.onclick = () => socket.emit('unsend-payload', payload.id);
      div.appendChild(unsendBtn);

      chatBox.appendChild(div);
      activeMessages.set(payload.id, div);
    }

    // ฟังก์ชันทำลายข้อมูลออกจากหน่วยความจำและหน้าจอ
    function purgeFromMemory(id) {
      const element = activeMessages.get(id);
      if (element) {
        // เคลียร์การอ้างอิงรูปภาพ เพื่อให้ Garbage Collector ทำงานทันที
        const img = element.querySelector('img');
        if (img) {
          img.src = '';
        }
        element.remove();
        activeMessages.delete(id);
      }
    }

    // ทำลายข้อมูลใน RAM ทั้งหมดเมื่อปิดหรือรีโหลดหน้าเว็บ
    window.addEventListener('beforeunload', () => {
      activeMessages.forEach((el, id) => purgeFromMemory(id));
      activeMessages.clear();
      document.getElementById('chat-box').innerHTML = '';
    });
  </script>
</body>
</html>
