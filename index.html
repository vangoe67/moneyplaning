<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบวางแผนการเงินส่วนบุคคล (Financial Planner)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 25px; }
    header h1 { color: #2c3e50; font-size: 28px; }
    
    /* Dashboard Cards */
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; text-transform: uppercase; }
    .card p { font-size: 24px; font-weight: bold; }
    .card.income p { color: #2ecc71; }
    .card.expense p { color: #e74c3c; }
    .card.balance p { color: #3498db; }
    .card.savings p { color: #9b59b6; }

    /* Layout Sections */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .section-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .section-card h2 { font-size: 18px; margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #f4f7f6; padding-bottom: 8px; }

    /* Form Styles */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
    .btn { width: 100%; padding: 10px; background: #3498db; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #2980b9; }

    /* Progress Bar */
    .progress-container { margin-top: 15px; background: #eee; border-radius: 8px; height: 16px; overflow: hidden; }
    .progress-bar { background: #2ecc71; height: 100%; width: 0%; transition: width 0.3s; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; font-size: 14px; border-bottom: 1px solid #eee; }
    th { background: #fafafa; color: #666; }
    .amount-income { color: #2ecc71; font-weight: bold; }
    .amount-expense { color: #e74c3c; font-weight: bold; }
    .delete-btn { background: #ff5555; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ระบบวางแผนและบริหารการเงิน</h1>
  </header>

  <!-- Dashboard สรุปภาพรวม -->
  <div class="dashboard">
    <div class="card income">
      <h3>รายรับรวม</h3>
      <p id="total-income">฿0</p>
    </div>
    <div class="card expense">
      <h3>รายจ่ายรวม</h3>
      <p id="total-expense">฿0</p>
    </div>
    <div class="card balance">
      <h3>คงเหลือสุทธิ</h3>
      <p id="net-balance">฿0</p>
    </div>
    <div class="card savings">
      <h3>ความคืบหน้าเป้าหมาย</h3>
      <p id="goal-progress-text">0%</p>
    </div>
  </div>

  <div class="grid">
    <!-- ฟอร์มบันทึกรายการ -->
    <div class="section-card">
      <h2>บันทึก รายรับ - รายจ่าย</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label>ประเภท</label>
          <select id="type">
            <option value="income">รายรับ (+)</option>
            <option value="expense">รายจ่าย (-)</option>
          </select>
        </div>
        <div class="form-group">
          <label>รายการ</label>
          <input type="text" id="description" placeholder="เช่น เงินเดือน, ค่าอาหาร" required>
        </div>
        <div class="form-group">
          <label>จำนวนเงิน (บาท)</label>
          <input type="number" id="amount" placeholder="0" min="1" required>
        </div>
        <button type="submit" class="btn">บันทึกรายการ</button>
      </form>
    </div>

    <!-- ฟอร์มวางแผนเป้าหมายเงินออม -->
    <div class="section-card">
      <h2>วางแผนเป้าหมายการเงิน</h2>
      <form id="goal-form">
        <div class="form-group">
          <label>ชื่อเป้าหมาย</label>
          <input type="text" id="goal-name" placeholder="เช่น กองทุนเกษียณ, ซื้อรถ" required>
        </div>
        <div class="form-group">
          <label>จำนวนเงินที่ต้องใช้ (บาท)</label>
          <input type="number" id="goal-target" placeholder="100000" min="1" required>
        </div>
        <div class="form-group">
          <label>ระยะเวลาที่ต้องการเก็บ (เดือน)</label>
          <input type="number" id="goal-months" placeholder="12" min="1" required>
        </div>
        <button type="submit" class="btn" style="background-color: #8e44ad;">คำนวณเป้าหมาย</button>
      </form>

      <div style="margin-top: 15px;" id="goal-summary">
        <p style="font-size: 14px; color: #666;" id="goal-plan-text">ยังไม่ได้กำหนดเป้าหมาย</p>
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ตารางแสดงรายการล่าสุด -->
  <div class="section-card">
    <h2>ประวัติรายการ</h2>
    <table>
      <thead>
        <tr>
          <th>รายการ</th>
          <th>ประเภท</th>
          <th>จำนวนเงิน</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="transaction-list"></tbody>
    </table>
  </div>
</div>

<script>
  // โหลดข้อมูลจาก LocalStorage
  let transactions = JSON.parse(localStorage.getItem('fin_transactions')) || [];
  let goal = JSON.parse(localStorage.getItem('fin_goal')) || null;

  const transactionForm = document.getElementById('transaction-form');
  const goalForm = document.getElementById('goal-form');

  // เพิ่มรายการ
  transactionForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const type = document.getElementById('type').value;
    const description = document.getElementById('description').value;
    const amount = parseFloat(document.getElementById('amount').value);

    const transaction = {
      id: Date.now(),
      type,
      description,
      amount
    };

    transactions.push(transaction);
    updateData();
    transactionForm.reset();
  });

  // ตั้งค่าเป้าหมายการเงิน
  goalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('goal-name').value;
    const target = parseFloat(document.getElementById('goal-target').value);
    const months = parseInt(document.getElementById('goal-months').value);

    goal = { name, target, months };
    localStorage.setItem('fin_goal', JSON.stringify(goal));
    updateData();
  });

  // ลบรายการ
  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    updateData();
  }

  // อัปเดตและแสดงผลข้อมูลทั้งหมด
  function updateData() {
    localStorage.setItem('fin_transactions', JSON.stringify(transactions));

    let totalIncome = 0;
    let totalExpense = 0;

    const list = document.getElementById('transaction-list');
    list.innerHTML = '';

    transactions.forEach(t => {
      if (t.type === 'income') totalIncome += t.amount;
      else totalExpense += t.amount;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${t.description}</td>
        <td>${t.type === 'income' ? 'รายรับ' : 'รายจ่าย'}</td>
        <td class="${t.type === 'income' ? 'amount-income' : 'amount-expense'}">
          ${t.type === 'income' ? '+' : '-'}฿${t.amount.toLocaleString()}
        </td>
        <td><button class="delete-btn" onclick="deleteTransaction(${t.id})">ลบ</button></td>
      `;
      list.appendChild(row);
    });

    const netBalance = totalIncome - totalExpense;

    document.getElementById('total-income').innerText = `฿${totalIncome.toLocaleString()}`;
    document.getElementById('total-expense').innerText = `฿${totalExpense.toLocaleString()}`;
    document.getElementById('net-balance').innerText = `฿${netBalance.toLocaleString()}`;

    // คำนวณความคืบหน้าเป้าหมายการเงิน
    if (goal) {
      const monthlyNeeded = (goal.target / goal.months).toFixed(0);
      const progressPercent = Math.min(Math.max((netBalance / goal.target) * 100, 0), 100).toFixed(1);

      document.getElementById('goal-plan-text').innerHTML = 
        `เป้าหมาย: <b>${goal.name}</b> (฿${goal.target.toLocaleString()})<br>` +
        `ต้องออมอย่างน้อยเดือนละ: <b>฿${parseFloat(monthlyNeeded).toLocaleString()}</b> เป็นเวลา ${goal.months} เดือน`;
      
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      document.getElementById('goal-progress-text').innerText = `${progressPercent}%`;
    }
  }

  // เรียกทำงานครั้งแรก
  updateData();
</script>

</body>
</html>
